name: Build TelePlay APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - '.github/patches.sh'
      - '.github/inspect.sh'
      - 'TelePlay-features-added.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract TelePlay ZIP
        run: |
          unzip -q -o TelePlay-features-added.zip -d teleplay
          echo "ZIP extracted"

      - name: Apply source patches
        run: bash .github/patches.sh

      - name: Find Android project
        run: |
          GRADLEW=$(find teleplay -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi
          echo "Gradle wrapper: $GRADLEW"
          echo "GRADLEW=$GRADLEW" >> $GITHUB_ENV
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> $GITHUB_ENV

      - name: Dump source context
        run: |
          mkdir -p report
          bash .github/inspect.sh > report/context.txt 2>&1 || true

      - name: Publish context report
        run: |
          cd report
          git init -q -b build-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "context report run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-logs

      - name: Build Debug APK
        id: build
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee "$GITHUB_WORKSPACE/report/build-full.log"

      - name: Summarize build log
        if: always()
        run: |
          echo "build outcome: ${{ steps.build.outcome }}" > report/status.txt
          if [ -f report/build-full.log ]; then
            tail -n 250 report/build-full.log > report/build-tail.txt
            grep -nE "error:|e: |FAILED|What went wrong|Caused by|Could not|Execution failed" -A3 report/build-full.log | head -150 > report/build-errors.txt || true
            rm report/build-full.log
          fi

      - name: Publish build report
        if: always()
        run: |
          cd report
          rm -rf .git
          git init -q -b build-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build report run ${{ github.run_number }} (${{ steps.build.outcome }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-logs

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: TelePlay-debug-APK
          path: |
            **/build/outputs/apk/**/*.apk

      - name: Release APK
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TelePlay build ${{ github.run_number }}
          files: |
            **/build/outputs/apk/debug/*.apk

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
